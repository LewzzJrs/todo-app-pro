<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo List — Catat & Kelola Tugasmu</title>
  <meta name="description"
    content="Aplikasi to-do list simpel untuk mencatat dan mengelola tugas harianmu, lengkap dengan tanggal, filter, dan penanda tugas terlambat." />
  <meta name="theme-color" content="#020617" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta property="og:title" content="ToDo List" />
  <meta property="og:description"
    content="Aplikasi to-do list simpel untuk mencatat dan mengelola tugas harianmu." />
  <meta property="og:type" content="website" />
</head>

<body class="bg-slate-950 text-slate-100 flex flex-col items-center pt-12 min-h-screen font-sans px-4">
  <div class="w-full max-w-3xl flex flex-col gap-4">
  <div class="flex flex-col md:flex-row gap-4 items-start">
    <aside class="w-full md:w-56 md:shrink-0 bg-slate-900 p-3 md:p-4 rounded-xl border border-slate-800 shadow-2xl">
      <h2 class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-2 px-1">Filter Bulan</h2>
      <div id="month-list" class="flex md:flex-col gap-1 overflow-x-auto md:overflow-visible pb-1 md:pb-0"></div>
    </aside>

    <main class="w-full max-w-md mx-auto md:mx-0 bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-2xl h-fit">
      <header class="mb-6 flex items-center justify-between">
        <h1 class="text-3xl font-bold text-white tracking-tight">ToDo List</h1>
        <button type="button" id="clear-all-btn" title="Hapus semua tugas"
          class="px-3 py-1.5 text-sm font-semibold rounded-lg bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white border border-slate-700 transition-colors">
          Hapus Semua
        </button>
      </header>

      <div id="reminder-banner"></div>

      <section class="mb-6">
        <form id="todo-form" class="flex flex-col gap-2">
          <input type="text" id="todo-input" placeholder="Ketik tugas barumu disini..."
            class="flex-1 px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-white placeholder-slate-400" />
          <div class="flex flex-col gap-1 self-start w-full max-w-xs">
            <label for="todo-date-input" class="text-xs text-slate-500 px-1">Pilih tanggal (opsional)</label>
            <input type="date" id="todo-date-input" title="Tanggal (opsional)"
              class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-white placeholder-slate-400 scheme-dark" />
          </div>
          <button type="submit"
            class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors"> Tambah
          </button>
        </form>
      </section>

      <section class="mb-4 flex items-center justify-between text-sm">
        <div id="filter-tabs" class="flex gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700">
          <button type="button" data-filter="all"
            class="filter-btn px-3 py-1 rounded-md font-medium transition-colors">Semua</button>
          <button type="button" data-filter="active"
            class="filter-btn px-3 py-1 rounded-md font-medium transition-colors">Aktif</button>
          <button type="button" data-filter="completed"
            class="filter-btn px-3 py-1 rounded-md font-medium transition-colors">Selesai</button>
        </div>
        <span id="todo-counter" class="text-slate-400"></span>
      </section>

      <section>
        <ul id="todo-list" class="space-y-3">

        </ul>
      </section>
    </main>
  </div>

  <section class="w-full bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-2xl">
    <div class="flex items-center justify-between mb-2 px-1">
      <h2 class="text-xs font-semibold uppercase tracking-wide text-slate-500">Riwayat</h2>
      <button type="button" id="clear-history-btn" title="Hapus riwayat"
        class="text-slate-600 hover:text-rose-400 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18" />
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
          <path d="M10 11v6" />
          <path d="M14 11v6" />
        </svg>
      </button>
    </div>
    <div id="history-list" class="flex flex-col gap-1 max-h-48 overflow-y-auto pr-1"></div>
  </section>
  </div>

  <footer class="w-full max-w-3xl mt-2 mb-6 flex items-center justify-center gap-4 text-sm text-slate-500">
    <span>Dibuat oleh LewzzJrs</span>
    <a href="https://github.com/LewzzJrs" target="_blank" rel="noopener noreferrer" title="GitHub"
      class="hover:text-slate-300 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
      </svg>
    </a>
    <a href="https://www.linkedin.com/in/tumbukz/" target="_blank" rel="noopener noreferrer" title="LinkedIn"
      class="hover:text-slate-300 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
      </svg>
    </a>
  </footer>

  <div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-[calc(100%-2rem)] max-w-sm">
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>

</html>
